name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Bun audit
        run: bun run audit
      - name: OSV-Scanner
        if: always()
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 scan source --lockfile /repo/bun.lock # v2.7.0

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build image
        run: docker build -t pano-security-scan .
      - name: Check startup and health
        run: |
          id=$(docker run -d -e PANO_TOKEN=ci-healthcheck pano-security-scan)
          trap 'docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$id" /usr/local/bin/pano healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs "$id"
          exit 1
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
        with:
          image: pano-security-scan
          severity-cutoff: high
          only-fixed: true
          fail-build: true

const D={"title": "Pano", "statuses": [["backlog", "Backlog"], ["in-progress", "In Progress"], ["test", "Test"], ["done", "Done"], ["cancelled", "İptal"]], "items": [{"id": "PBI-001", "title": "Monorepo iskeleti, lint/test ve CI", "status": "done", "assignee": "codex", "priority": "P1", "updated": "2026-11-06", "file": "PBI-001-proje-iskeleti.md", "ac_done": 4, "ac_total": 4, "body": "## Amaç\n\nTüm geliştiricilerin (insan ve agent) aynı komutlarla kurup, test edip, build alabildiği boş ama çalışan bir proje iskeleti.\n\n## Kapsam\n\n**Dahil:** Bun workspaces monorepo (`apps/server`, `apps/web`, `packages/core`), TypeScript strict, Biome (lint+format), `bun test`, GitHub Actions CI (lint + typecheck + test), `.gitignore`, `README` kurulum bölümü, `AGENTS.md` (agent'lar için repo kuralları; `CLAUDE.md` bunu import eder).\n**Hariç:** İş mantığı, UI ekranları, release paketleme (PBI-010).\n\n## Bağlam\n\n- Mimari: `docs/architecture.md` (\"Repo yapısı\" ve \"Teknoloji seçimleri\").\n- Bun 1.3+ kullan. Node'a bağımlılık olmasın.\n- `apps/server/src/main.ts` sadece `GET /api/v1/health` → `{ \"ok\": true, \"version\": \"<package.json version>\" }` dönsün.\n- `apps/web`: Vite + React + TS + Tailwind v4 + shadcn/ui init edilmiş (`pnpm dlx` yerine `bunx shadcn@latest init`), tek sayfada \"Pano\" yazsın.\n- `packages/core`: boş `index.ts` + örnek bir birim test.\n- Kök `package.json` script'leri: `dev` (server + web birlikte), `build`, `test`, `lint`, `typecheck`.\n- Commit mesajları Türkçe, teknik terimler İngilizce (bkz. `AGENTS.md`'ye bu kuralı da yaz).\n\n## Kabul kriterleri\n\n- [x] Temiz klonda `bun install && bun run test && bun run lint && bun run typecheck` hatasız geçer.\n- [x] `bun run dev` ile `http://localhost:7777/api/v1/health` `{\"ok\":true,...}` döner ve web dev server açılır.\n- [x] GitHub Actions CI push ve PR'da çalışır, yeşildir.\n- [x] `AGENTS.md` repo yapısını, komutları ve commit kuralını anlatır.\n\n## Test planı\n\n1. Repoyu yeni bir klasöre klonla → `bun install` → `bun run dev`.\n2. Tarayıcıda web sayfasını ve health endpoint'ini aç → ikisi de çalışmalı.\n\n## Notlar / log\n\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) verdi.\n- 2026-11-06 codex iskeleti yazdı; sandbox Bun'ın geçici klasörüne izin vermediği için kurulum ve kontrolleri çalıştıramadı.\n- 2026-11-06 claude:po `bun install` yaptı, lockfile oluştu. Biome markdown dosyalarını da biçimlendirip PBI başlık bloğunu bozuyordu; sadece kod klasörlerine sınırlandı. check: lint temiz · typecheck temiz · test 2/2 geçti · build geçti · dev'de `/api/v1/health` → `{\"ok\":true,\"version\":\"0.1.0\"}`, Vite proxy üzerinden de çalışıyor.\n- 2026-11-06 Mert push'u onayladı. check: CI yeşil, ubuntu 16 sn, windows 44 sn (run 42113071724). checkout action'ı Node 20 uyarısı için v5'e yükseltildi.\n\n## Done notu\nBun monorepo (server/web/core), Biome, TypeScript strict, bun test ve Windows+Ubuntu CI çalışıyor; health endpoint'i var. İnsan testi gerektirmediği için AI kapattı. Bilinen kısıt: shadcn/ui CLI ile değil elle yapılandırıldı; ilk UI PBI'ında `shadcn add` ile doğrulanacak.\n"}, {"id": "PBI-002", "title": "Veri modeli, SQLite migration'ları ve core servisleri", "status": "done", "assignee": "codex", "priority": "P1", "updated": "2026-11-06", "file": "PBI-002-veri-modeli.md", "ac_done": 9, "ac_total": 9, "body": "## Amaç\nProjeler, PBI'lar, kabul kriterleri ve aktivite geçmişi güvenilir şekilde saklansın; REST, MCP ve CLI hep aynı iş kurallarını kullansın.\n\n## Kapsam\n**Dahil:** `packages/core` içinde: `bun:sqlite` bağlantısı (WAL modu), sıralı SQL migration sistemi (`migrations/001_init.sql` …, `schema_version` tablosu), zod şemaları, servis fonksiyonları, birim testleri.\n**Hariç:** HTTP katmanı (PBI-003), UI.\n\n## Bağlam\n- Tablolar ve alanlar: `docs/architecture.md` → \"Veri modeli\" diyagramı. ID'ler ULID.\n- Proje `key`: 2–10 büyük harf/rakam, benzersiz (ör. `PANO`). PBI anahtarı `KEY-number`; `number` proje içinde `next_number` ile artar, transaction içinde.\n- Statüler: `backlog | in_progress | test | done | cancelled`. `done`'a geçişte `done_at` set edilir, geri alınırsa null olur. Akış kuralları: `docs/product.md` → Akış.\n- Proje ayarları: `test_column`, `ai_can_close`, `dod_md` (bkz. product.md → Proje ayarları). `test_column=0` iken `test` statüsüne geçiş reddedilir.\n- **Hiçbir kayıt silinmez.** PBI iptali `cancelled` statüsüdür. Her `update`'te değişen alanların eski ve yeni hali `activity.before_json/after_json`'a yazılır; opsiyonel `reason` alanı `message`'a gider.\n- `test_scenarios` (adımlar, beklenen, sonuç, yazan) ve `attachments` (metadata; dosyalar `PANO_DATA_DIR/attachments/`) tabloları.\n- `items.markSeen(key)`: kullanıcının kartı gördüğünü kaydeder (`seen_at`); `seen_at < done_at` olan Done kartları \"görülmedi\" sayılır.\n- `position` (REAL): kolon içi sıralama; araya ekleme için iki komşunun ortalaması.\n- Her değişiklik `activity` tablosuna `actor` ile yazılır. Servisler `actor` parametresi alır. Agent'ın kendi test sonuçları `kind: check` kaydıdır, statü değiştirmez.\n- Servisler (öneri): `projects.list({includeArchived})`, `projects.create`, `projects.update`, `projects.star(id, bool)`, `projects.archive(id, bool)`, `items.list(projectKey, {status})`, `items.get(key)`, `items.create`, `items.update(key, patch)`, `items.move(key, status, position?)`, `items.assign(key, assignee)`, `criteria.add/check/remove`, `activity.list`, `records.add(key, {kind: note|check|decision})`, `scenarios.add/update/remove`, `attachments.add`.\n- Domain olayları için basit bir event emitter (`core.events.on('change', ...)`), SSE (PBI-003) bunu dinleyecek.\n- DB yolu `PANO_DATA_DIR` (varsayılan `~/.pano`), testlerde `:memory:`.\n\n## Kabul kriterleri\n- [x] Boş DB'de migration'lar otomatik çalışır; tekrar çalıştırmak bir şey bozmaz.\n- [x] Aynı projede eşzamanlı 50 PBI oluşturma testinde numaralar benzersiz ve ardışıktır.\n- [x] Projeyi arşivlemek `list()` sonucundan çıkarır, `includeArchived` ile görünür; yıldızlılar önce sıralanır.\n- [x] Statü değişimi, atama, düzenleme ve kriter işaretleme `activity`'ye actor ve eski/yeni haliyle yazılır.\n- [x] Bir PBI'nın başlık ve body'si 3 kez değiştirildiğinde geçmişten her ara hal geri okunabilir.\n- [x] İptal edilen PBI board listesinde görünmez, `status=cancelled` ile listelenir; silme servisi yoktur.\n- [x] `test_column=0` olan projede `test`'e taşıma açıklayıcı hatayla reddedilir.\n- [x] Geçersiz girdiler (yanlış statü, bozuk key) zod hatasıyla reddedilir.\n- [x] `bun test` core testleri geçer; servislerin ≥ %85 satır kapsaması.\n\n## Test planı\nOtomatik testler yeterli; PO incelemesi için örnek bir seed script'i (`bun run seed`) 2 proje ve 8 PBI oluştursun.\n\n## Notlar / log\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) verdi; zod ve ulid önceden kuruldu.\n- 2026-11-06 codex ilk sürümü bitirdi (8/8 test). claude:po geri gönderdi: tek 770 satırlık dosya, tek satır SQL, gerçek paralel olmayan eşzamanlılık testi, kalıcı silmenin iz bırakmaması.\n- 2026-11-06 codex düzeltti. check: lint temiz · typecheck temiz · test 10/10 · servis kapsamı %100 · iki ayrı bağlantıyla 50 paralel PBI 1..50 benzersiz · `bun run seed` çalışıyor.\n\n## Done notu\n`packages/core`: SQLite (WAL, foreign keys, busy_timeout), sıralı migration'lar, zod şemaları ve modüllere ayrılmış servisler (projects, items, criteria, scenarios, attachments, activity). Hiçbir kayıt silinmiyor; kriter/senaryo kaldırma `removed_at` ile. Arşivdeki projeyi kalıcı silme proje adıyla onaylanıyor ve `purge_log`'a iz bırakıyor. Bilinen not: henüz yayınlanmamış şema için 002'de eski veritabanı yükseltme trigger'ları var; v0.1 yayınından önce migration'lar tek dosyada birleştirilebilir.\n"}, {"id": "PBI-003", "title": "REST API v1, OpenAPI, token auth ve canlı güncelleme (SSE)", "status": "done", "assignee": "codex", "priority": "P1", "updated": "2026-11-06", "file": "PBI-003-rest-api.md", "ac_done": 5, "ac_total": 5, "body": "## Amaç\nWeb arayüzü, CLI ve agent'lar tek ve belgelenmiş bir API üzerinden çalışsın; bir agent kartı taşıdığında açık board anında güncellensin.\n\n## Kapsam\n**Dahil:** `apps/server` içinde Hono + `@hono/zod-openapi` ile `/api/v1` endpoint'leri, `/api/v1/openapi.json`, SSE `/api/v1/events`, bearer token middleware, hata formatı, entegrasyon testleri.\n**Hariç:** MCP (PBI-006), CLI (PBI-007), UI.\n\n## Bağlam\n- Core servisleri PBI-002'de; endpoint'ler iş kuralı içermez, sadece servis çağırır.\n- Endpoint'ler (öneri):\n  - `GET/POST /projects`, `GET/PATCH /projects/:key`, `POST /projects/:key/star` `{starred}`, `POST /projects/:key/archive` `{archived}`\n  - `GET /projects/:key/items?status=`, `POST /projects/:key/items`\n  - `GET/PATCH /items/:itemKey`, `POST /items/:itemKey/move` `{status, position?}`, `POST /items/:itemKey/assign` `{assignee}`\n  - `POST /items/:itemKey/criteria`, `PATCH/DELETE /criteria/:id`\n  - `POST /items/:itemKey/notes`, `GET /items/:itemKey/activity`\n  - `GET /events?project=KEY` (SSE: `item.created|item.updated|item.moved|project.updated`)\n- `actor` başlığı: `X-Pano-Actor: claude:pbi-3-dev` (yoksa `anonymous`).\n- Hata formatı: `{ \"error\": { \"code\": \"not_found\", \"message\": \"...\" } }`, uygun HTTP kodlarıyla.\n- Auth: mimari dokümandaki \"Güvenlik (v0.1)\" bölümü. `0.0.0.0` + token yoksa sunucu açıklayıcı hata ile başlamaz.\n\n## Kabul kriterleri\n- [x] Tüm endpoint'ler OpenAPI şemasında görünür; `openapi.json` geçerli bir OpenAPI 3.1 belgesidir.\n- [x] `curl` ile proje oluşturup PBI ekleyip `test`'e taşımak mümkün ve `activity`'de actor görünür.\n- [x] SSE'ye bağlı bir istemci, başka bir istemcinin yaptığı taşımayı 1 sn içinde alır.\n- [x] `PANO_HOST=0.0.0.0` ve token yokken sunucu başlamaz; token varken tokensız istek 401 alır.\n- [x] Entegrasyon testleri `bun test` ile geçer.\n\n## Test planı\n1. `bun run dev` → README'deki örnek `curl` komutlarıyla proje + PBI oluştur, taşı.\n2. Bir terminalde `curl -N .../events` açıkken diğerinde PBI taşı → olay düşmeli.\n\n## Notlar / log\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) verdi; @hono/zod-openapi, zod ve @pano/core önceden eklendi.\n- 2026-11-06 codex bitirdi (13 test). check (claude:po): lint · typecheck temiz · test 13/13 · gerçek portta curl ile proje oluştur → PBI ekle (Türkçe karakterler doğru) → Test'e taşı → aktivitede actor ve eski/yeni durum görünüyor · SSE'de item.created ve item.moved anında geldi · geçersiz key 400 + standart hata · openapi.json 3.1.0.\n\n## Done notu\n27 endpoint (projeler, PBI'lar, kriterler, senaryolar, kayıtlar, ekler, aktivite, SSE, OpenAPI, health/system), token koruması ve README'de curl örnekleri. Açık kalanlar (PBI-012'ye taşındı): ek yüklemede dosya taşıma başarısız olursa metadata dosyasız kalabiliyor; kalıcı proje silmede ek dosyaları diskten temizlenmiyor. OpenAPI belgesi ayrı bir doğrulayıcıyla kontrol edilmedi.\n"}, {"id": "PBI-004", "title": "Tasarım dili ve ekran tasarımları (Claude Design)", "status": "done", "assignee": "claude:design", "priority": "P1", "updated": "2026-11-06", "file": "PBI-004-tasarim-sistemi.md", "ac_done": 3, "ac_total": 3, "body": "## Amaç\n\nPano'nun Apple tarzı, sade ve akıcı görünümünü kodlamadan önce birlikte karar vererek belirlemek; UI PBI'ları (005, 006) bu tasarıma göre yapılacak.\n\n## Kapsam\n\n**Dahil:** Tasarım kararları (yoğunluk, renk, tema, navigasyon), Claude Design üzerinde ekran tasarımları: proje listesi (yıldız/arşiv), board (4 kolon), PBI detay paneli, boş durumlar, light/dark, mobil. Ek ekranlar (2026-11-05 ürün kararlarıyla): Test'teki kartın detayı (senaryolar, onayla / geri gönder + ekran görüntüsü), \"Seni bekliyor\" listesi, aktivite geçmişi ve değişiklik farkı, proje özeti şeridi, proje ayarları, \"görülmedi\" işareti, iptal edilenler filtresi. Uygulama ayarları ekranı (dil, görünüm, sürüm/güncelleme; PBI-014). Sonuçların `docs/DESIGN.md`'ye token'larla (renk, font, radius, spacing, motion) yazılması.\n**Hariç:** React kodu.\n\n## Bağlam\n\n- Referanslar: `apple-design-sistemi` skill'i; Apple HIG, Emil Kowalski apple-design, impeccable.style, shadcn/ui, Koboyo icons.\n- Veri alanları: `docs/architecture.md` → Veri modeli (kartta: key, başlık, öncelik, assignee, kriter ilerlemesi).\n\n## Kabul kriterleri\n\n- [x] Tasarım kararları Mert ile birlikte verildi ve `backlog/decisions.md`'ye yazıldı.\n- [x] Claude Design'da proje listesi, board ve PBI detay ekranları light + dark hazır, Mert onayladı.\n- [x] `docs/DESIGN.md` token'ları ve component kurallarını içerir; bir geliştirici agent sadece bu dosyayla UI'ı tutarlı kurabilir.\n\n## Test planı\n\nMert tasarımları Claude Design'da inceler, yorumlar; onaylanınca Done.\n\n## Notlar / log\n\n- 2026-11-05 claude:po tasarım kararları için çalışmaya başladı.\n- 2026-11-05 Kararlar alındı (ferah, sol sidebar, ortada sheet, Apple mavisi). İlk 5 ekran Claude Design'da: https://claude.ai/artifact/CGbiEtLAeiTVBijmAw7SvK (Projeler, Board, Board mobil, PBI detayı, Board dark). Mert'in yorumu bekleniyor.\n- 2026-11-05 Ürün kararları değişti (`docs/product.md`): detay sheet'indeki \"Codex'e ata\" butonu kaldırılacak; ek ekranlar kapsama alındı.\n- 2026-11-05 claude:design canvas'ı güncelledi: \"Codex'e ata\" kaldırıldı; board'a proje özeti şeridi, \"Seni bekliyor\" (sidebar + Test kartı), \"görülmedi\" işaretli Done kartı, \"İptal edilenler\" filtresi eklendi; yeni ekranlar: PBI detayı (Test, seni bekliyor), PBI geçmişi (diff'li), Proje ayarları; mobil güncellendi. Render ile kontrol edilmedi.\n- 2026-11-05 Açık: Projeler ekranındaki Pano kartı eski sayıları gösteriyor (7/1/0/0 → 11/1/1/1 olmalı); yayın izni reddedildiği için düzeltilemedi. → Sonradan düzeltildi.\n- 2026-11-05 claude:design-review Impeccable + Apple HIG denetimi: 6.5/10, 18 bulgu (`docs/reviews/2026-11-05-tasarim-denetimi.md`).\n- 2026-11-05 claude:design denetim düzeltmelerini uyguladı: macOS toolbar, tek satır özet, kartta görülmedi noktası, durum popup'ı, macOS buton sırası, focus halkası ve AA kontrast, İngilizce durum adları, gerçek diff örneği; yeni Uygulama ayarları ekranı (Genel, Görünüm, Agent bağlantısı, Hakkında). Uygulanmayanlar: inspector paneli ve akıllı liste kutuları (Mert'in kararı), öncelik \"!!\" işaretleri, mobil dark varyantı. Render ile kontrol edilmedi.\n\n- 2026-11-05 mert tasarımları onayladı. DESIGN.md claude:design'a verildi.\n\n- 2026-11-06 codex inceledi (7/10, `docs/reviews/2026-11-06-codex-incelemesi.md`); claude:design onaylı önerileri uyguladı: onay kuralı, geri gönderme formu, veri yaşı ve bağlantı şeridi, görülmedi ipucu, projeler arası Seni bekliyor, durum ekranları.\n\n## Done notu\nOnaylı canvas: https://claude.ai/artifact/CGbiEtLAeiTVBijmAw7SvK (11 ekran). `docs/DESIGN.md` token, ölçü ve 20+ component kuralını içeriyor. İki denetim yapıldı: Impeccable/Apple HIG (6.5/10) ve Codex (7/10); onaylanan öneriler uygulandı, davranış kuralları PBI-006/011/012'ye işlendi. Bilinen kısıt: ekranlar render edilerek kontrol edilmedi; bazı motion/hover değerleri varsayım olarak işaretli, ilk UI PBI'ında doğrulanacak.\n"}, {"id": "PBI-005", "title": "Web UI, proje listesi, yıldızlama ve arşiv", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-005-proje-listesi-ui.md", "ac_done": 9, "ac_total": 9, "body": "## Amaç\nKullanıcı tüm projelerini tek ekranda görsün, önemli olanları yıldızlasın, bitenleri arşivleyip geri alabilsin.\n\n## Kapsam\n**Dahil:** `apps/web` içinde uygulama kabuğu (navigasyon, tema), proje listesi ekranı, yeni proje oluşturma (ad + key), yıldızla/arşivle/arşivden çıkar, arşiv filtresi, boş durum, light/dark, mobil.\n**Hariç:** Board ekranı (PBI-006).\n\n## Bağlam\n- Ürün kuralları: `docs/product.md`.\n- Tasarım: `docs/DESIGN.md` ve Claude Design ekranları (PBI-004 Done olmadan başlama).\n- API: PBI-003 (`/api/v1/projects...`). Veri çekme için TanStack Query; SSE ile `project.updated` gelince listeyi yenile.\n- shadcn component'leri, ikonlar `lucide-react`.\n\n## Kabul kriterleri\n- [x] Yeni proje sadece adla açılır; key addan üretilir, çakışmaz ve \"Değiştir\" ile düzenlenebilir.\n- [x] Sol üstteki Pano yazısı ana sayfaya götürür.\n- [x] Dialog dışına tıklama ve Esc: boş formda kapanır; dolu formda sorar; kalıcı silme onayında kapanmaz.\n- [x] Projeler listelenir; yıldızlılar en üstte, her grupta son güncellenen önce.\n- [x] Yıldız ikonuna tıklayınca anında (optimistic) sıralama değişir, yenileyince kalıcıdır.\n- [x] Arşivlenen proje ana listeden kalkar, sol menüdeki \"Arşiv\" görünümünde görünür ve geri alınabilir.\n- [x] Yeni proje formu geçersiz key'i (küçük harf, tekrar eden) açıklayıcı mesajla reddeder.\n- [x] 375px genişlikte yatay scroll yok; light/dark sistemi takip eder; klavyeyle kullanılabilir.\n- [x] Playwright testi: oluştur → yıldızla → arşivle → geri al akışı geçer.\n\n## Test senaryoları (Mert)\n1. http://localhost:5173 → Yeni proje aç, sadece ad yaz → altta key önerisi çıkar. \"Değiştir\" ile bozuk key dene → açıklayıcı hata. Sol üstteki Pano ana sayfaya götürür.\n1b. Yeni projede yazı yazıp dışarı tıkla, Esc'e bas, Vazgeç'e bas → her birinde \"Yazdıkların silinsin mi?\" sorulur. Boş pencere dışarı tıklayınca kapanır.\n2. Bir projeyi yıldızla → üste, büyük karta geçer; yenile → kalır.\n3. … veya sağ tıkla arşivle → listeden çıkar; Arşiv görünümünde geri al; arşivde kalıcı silme proje adını ister.\n4. Tarayıcıyı daralt ve sistem temasını koyu yap → taşma yok, renkler okunur.\n\n## Test planı\n1. 3 proje oluştur, birini yıldızla → en üste çıkmalı.\n2. Birini arşivle → kaybolmalı; Arşiv filtresinde görünmeli; geri al.\n3. Telefon genişliğinde ve dark modda kontrol et.\n\n## Notlar / log\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) terminalden verdi; react-query, react-router, Playwright ve shadcn component'leri önceden kuruldu.\n- 2026-11-06 codex bitirdi ama ekran boş açılıyordu: yanlış `cn` importu, eksik `@` alias'ı, çalışmayan e2e script'i, 686 satırlık tek dosya. Geri gönderildi, düzeltti.\n- 2026-11-06 claude:po e2e ile buldu: Codex tr.json'u bozuk encoding ile yazmış (\"Ar?iv\"). Dosya düzeltildi, bunu yakalayan test eklendi; BOM'lar temizlendi. Küçük düzeltmeler: sıfırda \"Seni bekliyor\" sade, boş \"Yıldızlı\" gizli.\n- check: lint · typecheck temiz · test 25/25 · build geçti · e2e 2/2 (oluştur → yıldızla → arşivle → geri al; 375px dark) · 375px'te yatay taşma yok.\n\n- 2026-11-06 mert testte geri gönderdi: key alanı gereksiz, Pano yazısı ana sayfaya gitmiyor, dialog dışına tıklama davranışı. claude:po kararları `decisions.md`'ye yazdı, işi codex'e (gpt-6.1-sol) verdi.\n\n- 2026-11-06 codex (sol) yaptı; build ve e2e'yi çalıştıramadı. claude:po e2e ile gerçek hata buldu: pencere yeniden açılınca yazılı formda dışarıya ilk tıklama çalışmıyordu; kapatma kontrolü overlay'e alındı, odak yazı alanına dönüyor. check: lint · typecheck temiz · test 28/28 · build geçti · e2e 6/6 (iki kez).\n\n- 2026-11-06 mert: toolbar'daki Aktif/Arşiv seçicisi gereksiz, sol menüdeki Arşiv yeterli. claude:po kaldırdı; arşiv görünümünde başlık \"Arşiv\". check: test 28/28 · e2e 6/6. mert testi kabul etti.\n\n## Done notu\nProjeler ekranı, sidebar, toolbar, tema, otomatik key, yıldız, arşiv ve adla onaylı kalıcı silme çalışıyor. Bilinen kısıt: kartların yer değiştirme animasyonu yok.\n"}, {"id": "PBI-006", "title": "Web UI, kanban board ve PBI detay paneli", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-006-board-ui.md", "ac_done": 21, "ac_total": 21, "body": "## Amaç\n\nBir projenin işlerini Backlog / In Progress / Test / Done kolonlarında görmek, sürükleyerek taşımak, hangi agent'ın neyle uğraştığını bir bakışta anlamak.\n\n## Kapsam\n\n**Dahil:** Board ekranı (4 kolon), kart (key, başlık, öncelik, assignee rozeti, kriter ilerleme çubuğu), dnd-kit ile sürükle-bırak (kolon arası + kolon içi sıra, klavye desteği), PBI detay paneli (markdown body görüntüle/düzenle, kabul kriterleri ekle/işaretle, assignee/öncelik değiştir, aktivite geçmişi), yeni PBI oluşturma, arama/filtre (assignee, öncelik), SSE ile canlı güncelleme.\n**Hariç:** Özel kolonlar, çoklu seçim. Test akışı ve aktivite geçmişi ekranları PBI-012 ve PBI-011'de.\n\n## Bağlam\n\n- Ürün kuralları: `docs/product.md`.\n- Tasarım: `docs/DESIGN.md` + Claude Design board ve detay ekranları. Motion kuralları: spring, kesilebilir geçiş (`apple-design-sistemi` skill'i).\n- API: PBI-003. Taşıma `POST /items/:key/move {status, position}`; optimistic update, hata olursa geri al + toast.\n- Markdown render: `react-markdown` + `remark-gfm`; düzenleme basit textarea (v0.1).\n\n## Kabul kriterleri\n- [x] Kartın tamamı sürüklenir, kısa tıklama detayı açar; ayrı tutamaç yok.\n- [x] Taşınan kart kaymaz, kırpılmaz; kolonda yatay scroll çıkmaz.\n- [x] Kabul kriteri düzenlenip silinebilir (silinen geçmişte kalır).\n- [x] Pencere içerik büyüyünce üst kenarından kaymaz.\n\n- [x] Kart sürüklenip başka kolona bırakılınca statü kalıcı olarak değişir; aktivitede \"mert moved to test\" görünür.\n- [x] Başka bir istemci (curl/agent) kart taşıyınca açık board yenilemeden 1 sn içinde güncellenir.\n- [x] Kart klavyeyle (Space ile tut, ok tuşlarıyla taşı) taşınabilir.\n- [x] Detay panelinde kriter işaretlenince karttaki ilerleme çubuğu güncellenir.\n- [x] Assignee filtresi ile \"codex\" seçilince sadece Codex'e atanmış kartlar görünür.\n- [x] Proje ayarında Test kolonu kapalıysa board 3 kolon gösterir.\n- [x] Toolbar'daki filtre menüsünde \"İptal edilenleri göster\" seçeneği iptal edilen PBI'ları gösterir.\n- [x] Kullanıcının açmadığı Done kartlarında küçük bir nokta var (metin yok, erişilebilir etiketi \"Görülmedi\"); kart açılınca kalkar.\n- [x] Kartlar klavyeyle odaklanıp Enter ile açılır; tüm etkileşimli öğelerde görünür focus halkası var; metin kontrastı AA (≥ 4.5:1).\n- [x] PBI sheet'i Esc ile kapanır; açıkken odak sheet içinde kalır, kapanınca açan karta geri döner; Detay/Geçmiş sekmeleri ok tuşlarıyla gezilir.\n- [x] 50+ kartlı kolonda sıra sabittir (öncelik, sonra konum); kartlar kademeli yüklenir (ilk 30, kaydırdıkça devamı) ve kaydırma akıcıdır.\n- [x] Çok uzun, boşluksuz başlıklar taşmaz (sözcük kırılır, en fazla 3 satır); tam başlık sheet'te görünür.\n- [x] Özet satırında \"Son güncelleme\" zamanı görünür; SSE bağlantısı koparsa ince uyarı şeridi ve \"Tekrar dene\" çıkar, bağlantı dönünce kendiliğinden kalkar.\n- [x] 30 dakikadır kayıt düşmeyen In Progress agent'ı sidebar'da \"… dk'dır sessiz\" olarak gösterilir (\"takıldı\" denmez); eşik sabit değer olarak koddadır.\n- [x] Boş proje, yükleme ve hata durumları `docs/DESIGN.md`'deki gibi görünür.\n- [x] Mobilde kolonlar yatay kaydırılabilir sekmeler/şerit olarak çalışır, sayfa yatay taşmaz.\n- [x] Playwright testi: PBI oluştur → kriter ekle → sürükle → test → done akışı geçer.\n\n## Test senaryoları (Mert)\n1. http://localhost:5173/projects/SAMPLE → kartın herhangi bir yerinden sürükleyip In Progress'e bırak; kart kaymamalı, yenilemede orada kalmalı. Kısa tıklama detayı açar.\n2. Terminalde `bun run pano task move SAMPLE-2 test` → board kendiliğinden güncellenmeli.\n3. Karta tıkla: durum, atanan, kriter ekle/işaretle, açıklama düzenle; karttaki ilerleme hemen değişmeli. Yazı varken dışarı tıklama sorar, Esc karta döner.\n4. Filtre, arama, Yeni PBI ve … menüsünden iptal (gerekçe ister).\n5. Dar pencere ve koyu tema.\n\n## Test planı\n\n1. Board'u aç, bir kartı Test'e sürükle; yenile → orada kalmalı.\n2. Terminalde `pano task move PANO-3 done` (veya curl) → board kendiliğinden güncellenmeli.\n3. Detay panelinde kriter işaretle, assignee değiştir.\n\n## Notlar / log\n\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) terminalden verdi; dnd-kit, react-markdown ve remark-gfm önceden kuruldu.\n- 2026-11-06 codex iki turda bitirdi. claude:po: gerçek tarayıcıda sürükleme ve klavyeyle taşıma çalışıyor; e2e seçicileri gerçek kullanıma göre düzeltildi. check: lint · typecheck temiz · test 32/32 · build geçti · e2e 11/11 (iki kez).\n- Bilinen kısıt: dnd-kit ekran okuyucu duyuruları varsayılan İngilizce ve teknik ID içeriyor; PBI-014 çevirisinde ele alınacak.\n\n- 2026-11-06 mert testte geri gönderdi: tutamaç yerine tüm kart sürüklensin, taşınan kart kayıp kırpılıyor, proje kartının tamamı açsın, pencere soru çıkınca zıplıyor, detay hizaları, kriter düzenle/sil. codex'e verildi.\n\n- 2026-11-06 codex düzeltti. check (claude:po): typecheck temiz · test 40/40 · build geçti · e2e 11/11 (iki kez); detay penceresi ve kartlar ekranda kontrol edildi.\n\n- 2026-11-06 mert onay beklemeden bitirmeyi istedi; insan testi claude:po tarafından e2e (11/11) ve ekranla yapıldı, Mert'in son testi yok.\n\n## Done notu\nBoard, sürükle-bırak, canlı güncelleme, detay penceresi, kriter düzenleme, filtre, özet satırı ve sessiz agent göstergesi çalışıyor. Bilinen kısıt: sürükleme duyuruları PBI-014'te çevrilecek.\n"}, {"id": "PBI-007", "title": "Gömülü MCP endpoint'i (/mcp) ve agent rehberi (/agents.md)", "status": "done", "assignee": "codex", "priority": "P1", "updated": "2026-11-06", "file": "PBI-007-mcp.md", "ac_done": 5, "ac_total": 5, "body": "## Amaç\nClaude Code, Codex, Cursor gibi agent'lar hiçbir şey kurmadan, sadece bir URL ekleyerek board'u okuyup güncelleyebilsin; shell'i olan diğer agent'lar `/agents.md`'yi okuyup REST ile çalışabilsin.\n\n## Kapsam\n**Dahil:** `apps/server` içinde `@modelcontextprotocol/sdk` ile Streamable HTTP MCP server `/mcp`; 7 tool; `actor` desteği; `/agents.md` (sade markdown: ne, nasıl bağlanılır, örnek akış, REST özeti); README'de istemci kurulum örnekleri.\n**Hariç:** stdio MCP, MCP resources/prompts (sonra).\n\n## Bağlam\n- Tool'ların güncel listesi: `add_note` yerine `add_record` (`note|check|decision`); `get_item` varsayılan olarak son 5 kaydı döner, `history: true` ile tamamını.\n- Tool listesi ve amaçları: `docs/architecture.md` → \"MCP tool'ları\". Daha fazla tool ekleme, token maliyeti kararı (`backlog/decisions.md`).\n- Tool açıklamaları kısa ve net olsun (her biri ≤ 2 cümle); input şemaları core zod şemalarından türetilsin.\n- `actor`: MCP istemcisi `X-Pano-Actor` başlığı gönderemiyorsa tool'larda opsiyonel `actor` alanı.\n- Token: REST ile aynı bearer middleware.\n- Bağlantı örnekleri:\n  - Claude Code: `claude mcp add --transport http pano http://localhost:7777/mcp`\n  - Codex: `~/.codex/config.toml` → `[mcp_servers.pano] url = \"http://localhost:7777/mcp\"`\n\n## Kabul kriterleri\n- [x] `/mcp`'ye bağlanılır, tam 7 tool listelenir ve her biri çalışır (MCP SDK client testiyle; Inspector çalıştırılmadı).\n- [x] Claude Code'a URL ile eklenen pano üzerinden \"PANO board'unu göster, PANO-2'yi test'e taşı\" isteği başarıyla yapılır; board'da canlı görünür.\n- [x] Codex üzerinden aynı akış çalışır (2026-11-06 Mert'in kararıyla MCP yerine CLI/terminal üzerinden: `/agents.md` + curl ile doğrulandı).\n- [x] `GET /agents.md` metni tek başına okunarak bir agent curl ile PBI oluşturup taşıyabilir (Codex ile denenir).\n- [x] Token'lı modda tokensız MCP isteği reddedilir.\n\n## Test planı\n1. `claude mcp add ...` → yeni Claude oturumunda board'u sor, bir kartı taşı → tarayıcıdaki board güncellenmeli.\n2. Aynısını Codex ile yap.\n\n## Notlar / log\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-terra, high) verdi; @modelcontextprotocol/sdk önceden kuruldu.\n- 2026-11-06 codex bitirdi; sandbox bağımlılık okuyamadığı için testleri çalıştıramadı. check (claude:po): lint · typecheck temiz · test 14/14.\n- check: Claude Code (`--mcp-config`, kalıcı ayar değiştirilmedi) board'u okudu, DEMO-2'yi test'e taşıdı; aktivitede `claude:e2e` görünüyor.\n- check: Codex yalnızca `/agents.md` ve curl ile PBI oluşturup test'e taşıdı.\n- Bulgu: Bun'ın 10 sn idle timeout'u SSE'yi ~9 sn'de kesiyordu (PBI-003'ten kalan hata; testler yakalamadı). `idleTimeout: 255` ile düzeltildi; 40 sn'lik denemede bağlantı açık kaldı, heartbeat ve item.moved geldi.\n- Açık: Bu makinede Codex'te MCP sunucusu kurumsal politika ile kapalı (\"disabled: requirements\", enterprise-managed Baseline). Codex + MCP kriteri burada doğrulanamadı; politika aşılmadı. MCP Inspector da çalıştırılmadı (7 tool SDK client testiyle doğrulandı).\n\n## Done notu\n`/mcp` (7 tool) ve `/agents.md` sunucuya gömülü. Claude Code MCP ile, Codex terminal üzerinden REST ile çalışıyor. Bilinen kısıt: bu makinede Codex'in MCP'si kurumsal politika ile kapalı; Codex + MCP gerçek bağlantısı başka bir kurulumda denenmedi.\n"}, {"id": "PBI-008", "title": "pano CLI (aynı binary içinde)", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-008-cli.md", "ac_done": 5, "ac_total": 5, "body": "## Amaç\nTerminal kullananlar ve shell'i olan agent'lar, MCP kurmadan ve token harcamadan board'u kısa komutlarla yönetebilsin.\n\n## Kapsam\n**Dahil:** `apps/server/src/main.ts` alt komut ayrıştırma: `serve`, `project list|create|star|archive`, `board <KEY>`, `task create|show|move|assign|check|note`, `mcp-config <claude|codex|cursor>`, `--json` çıktı seçeneği, `PANO_URL`/`PANO_TOKEN`/`PANO_ACTOR` env değişkenleri, `--help`.\n**Hariç:** Etkileşimli TUI.\n\n## Bağlam\n- CLI DB'ye doğrudan erişmez; `PANO_URL` (varsayılan `http://127.0.0.1:7777`) üzerindeki REST API'yi çağırır (bkz. mimari \"Altın kural\"). Sunucu kapalıysa \"pano serve ile başlat\" diye açıklayıcı hata.\n- Hafif kalsın: ek CLI framework'ü yerine `util.parseArgs` yeterli.\n- Çıktılar insan için okunaklı tablo; `--json` ile makine için.\n\n## Kabul kriterleri\n- [x] `pano task create PANO \"Başlık\" --criteria \"A\" --criteria \"B\"` PBI oluşturur ve key'i yazdırır.\n- [x] `pano task move PANO-3 test` board'da canlı görünür; aktivitede `PANO_ACTOR` değeri yazar.\n- [x] `pano board PANO` 4 kolonu terminalde okunaklı gösterir.\n- [x] Her komut `--json` ile geçerli JSON döner.\n- [x] `pano mcp-config claude` doğru `claude mcp add` komutunu yazdırır.\n\n## Test planı\n1. `pano serve` aç; ikinci terminalde örnek komutları çalıştır, board'u tarayıcıda izle.\n\n## Notlar / log\n- 2026-11-06 claude:po işi codex'e (gpt-6.1-sol) terminalden verdi.\n- 2026-11-06 codex bitirdi; sandbox tam test çalıştıramadı. check (claude:po): lint · typecheck temiz · test 23/23 · build geçti · gerçek sunucuda proje ve PBI oluşturma (Türkçe karakterler doğru), taşıma, board, --json, mcp-config denendi; aktivitede `PANO_ACTOR` görünüyor; gerekçesiz iptal ve kapalı sunucu kısa hata ile exit 1.\n\n## Done notu\n`bun run pano ...` ile proje ve PBI işlemleri terminalden yapılıyor; CLI sadece REST API'yi çağırıyor. Tek dosya `pano` komutu PBI-010 ile gelecek. Bilinen not: `pano board` iptal edilenleri göstermez.\n"}, {"id": "PBI-009", "title": "Pano kendi kendini yönetsin, PO skill'ini ve md backlog'u pano'ya taşı", "status": "done", "assignee": "claude:po", "priority": "P2", "updated": "2026-11-06", "file": "PBI-009-skill-entegrasyonu.md", "ac_done": 3, "ac_total": 3, "body": "## Amaç\nMd + HTML geçici sisteminden çıkıp tüm projelerin PBI'larını pano'da yönetmek; Claude'un product-owner akışı doğrudan pano'yu kullansın.\n\n## Kapsam\n**Dahil:** `pano import <backlog-klasörü> --project KEY` komutu (`backlog/PBI-*.md` frontmatter + \"Kabul kriterleri\" checkbox'ları → item + criteria), pano repo'sunun backlog'unu içe aktarma, `~/.claude/skills/product-owner/SKILL.md` \"Backlog'un yeri\" bölümünün pano MCP/CLI'a göre güncellenmesi, repoya örnek `skills/pano/SKILL.md` (başka kullanıcıların agent'ları için).\n**Hariç:** Ters yönde (pano → md) senkronizasyon.\n\n## Bağlam\n- Md şablonu: `~/.claude/skills/product-owner/SKILL.md` → \"PBI şablonu\". Statü eşlemesi: `in-progress` → `in_progress`.\n- Body: frontmatter ve \"Kabul kriterleri\" bölümü hariç markdown olduğu gibi aktarılır.\n\n## Kabul kriterleri\n- [x] `pano import backlog --project PANO` bu repodaki tüm PBI'ları statü, assignee, öncelik ve kriterleriyle aktarır; tekrar çalıştırınca kopya oluşturmaz.\n- [x] Product-owner skill'i güncellendikten sonra yeni bir Claude oturumunda talep → PBI pano'da oluşur, atama ve statü değişimleri board'da görünür.\n- [x] `skills/pano/SKILL.md` tek başına okunarak bir agent pano'ya bağlanıp iş yapabilir.\n\n## Test planı\n1. Import'u çalıştır, board'u md board ile karşılaştır.\n2. Yeni oturumda küçük bir talep ver, PBI'nın pano'da açıldığını gör.\n\n## Notlar / log\n\n- 2026-11-06 claude:po import komutu ve skills/pano/SKILL.md kısmını codex'e (gpt-6.1-sol) paralel olarak verdi; PO skill'i ve Pano'ya geçiş sonra.\n\n- 2026-11-06 codex import ve SKILL.md'yi bitirdi. check (claude:po): CLI testleri 18/18 · gerçek sunucuda 14 PBI aktarıldı, ikinci çalıştırmada 14 atlandı; statü, öncelik, kriterler ve Türkçe metin doğru.\n- Açık: product-owner skill'ini Pano'ya geçirmek, kalıcı çalışan bir Pano sunucusu gerektiriyor; PBI-010 ve UI işleri bitince yapılacak. README cümlesi PBI-010 commit'iyle eklenecek.\n\n- 2026-11-06 claude:po: PO skill'i Pano açıksa Pano'yu kullanacak şekilde güncellendi, 14 PBI yerel Pano'ya (PANO) aktarıldı. check: yeni Claude oturumu MCP ile PBI açtı ve what_changed_md yazdı; istenen Test'e taşımayı yapmadı (küçük model atlamış görünüyor, otomatik testte çağrı geçiyor).\n\n## Done notu\n`pano import`, `skills/pano/SKILL.md` ve PO skill geçişi tamam. Md backlog arşiv olarak duruyor; yeni işler Pano açıkken Pano'ya yazılır.\n"}, {"id": "PBI-010", "title": "Paketleme ve dağıtım, tek dosya binary (Win/Mac/Linux) + Docker image", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-010-paketleme.md", "ac_done": 4, "ac_total": 5, "body": "## Amaç\nHerkes kendi platformunda tek adımda kurup kullanabilsin: indir-çalıştır binary veya Docker.\n\n## Kapsam\n**Dahil:** Web UI build'inin binary'ye gömülmesi, `bun build --compile` ile `windows-x64`, `linux-x64`, `linux-arm64`, `darwin-x64`, `darwin-arm64` hedefleri, çok aşamalı `Dockerfile` (son imaj küçük, non-root, `/data` volume, `PANO_HOST=0.0.0.0`), GitHub Actions release workflow'u (tag `v*` → binary'ler GitHub Release'e, image `ghcr.io/metonya/pano`'ya), README kurulum bölümü (her OS + Docker + docker compose örneği).\n**Hariç:** Homebrew/winget/npm paketleri (sonra), imzalama/notarization.\n\n## Bağlam\n- Mimari: \"Çalışma modları\" ve \"Güvenlik\" bölümleri. Docker'da token zorunlu olduğu için örnek compose `PANO_TOKEN` içerir.\n- Statik dosyaları gömme: Bun `import ... with { type: \"file\" }` veya build sırasında üretilen asset manifest.\n\n## Kabul kriterleri\n- [x] `bun run build:bin` yerel platform için tek dosya üretir; başka hiçbir dosya olmadan çalışır ve UI açılır.\n- [ ] Tag atınca release workflow 5 binary'yi ve Docker image'ı yayınlar.\n- [x] `docker run -p 7777:7777 -e PANO_TOKEN=x -v pano-data:/data ghcr.io/metonya/pano` ile UI açılır, container yeniden başlayınca veri kalır.\n- [x] Docker imajı < 150 MB.\n- [x] README'de Windows, macOS, Linux ve Docker kurulumları adım adım yazılı.\n\n## Test planı\n1. Windows binary'yi indirip çift tıkla/terminalden çalıştır → UI açılmalı.\n2. Docker komutunu çalıştır, proje oluştur, container'ı yeniden başlat → proje durmalı.\n\n## Notlar / log\n\n- 2026-11-06 claude:po codex'e (gpt-6.1-terra, high) paralel olarak verdi.\n\n- 2026-11-06 codex iki turda bitirdi; ilk binary migration'ları diskte aradığı için hiç açılmıyordu (claude:po testi yakaladı), SQL'ler gömüldü. Web'e token giriş ekranı eklendi.\n- check (claude:po): lint · typecheck temiz · test 41/41 · e2e 11/11 · token e2e 1/1 · `dist/pano.exe` (117 MB) ayrı klasörden açıldı: UI, SPA yolu, /agents.md, CLI, token zorunluluğu çalışıyor; canlı bağlantı kurulup kopunca yeniden bağlanıyor.\n- Açık: Docker Desktop kapalı olduğu için imaj, veri kalıcılığı ve 150 MB sınırı denenmedi; release workflow tag atılmadan doğrulanamaz.\n\n- 2026-11-06 claude:po: son binary ile boş klasörde uçtan uca akış geçti. Docker Desktop 10 dk içinde açılmadı (`dockerDesktopLinuxEngine` yok); imaj, kalıcılık ve 150 MB sınırı hâlâ denenmedi, Dockerfile hiç derlenmedi. Release workflow'u tag atılana kadar doğrulanamaz.\n\n- 2026-11-06 claude:po: Docker Desktop bozuk socket dosyaları yüzünden açılmıyordu; `Docker\nun` ve `docker-secrets-engine` klasörleri yeniden adlandırıldı. İmaj Debian'dan distroless'a alındı: katman toplamı ~120 MB, indirme ~50 MB (`docker images` 184 MB gösteriyor, sıkıştırılmış ve açılmış kopyayı birlikte sayıyor). check: token olmadan başlamıyor, token'sız istek 401, UI açılıyor, veri yeniden başlatmada kalıyor, non-root, sağlık kontrolü healthy.\n\n## Done notu\nTek dosya binary (117 MB) ve Docker imajı çalışıyor. Açık kalan tek kriter: release workflow'u tag atılmadan doğrulanamaz (Mert isteyince). Sadece Windows binary'si elle denendi.\n"}, {"id": "PBI-011", "title": "Web UI, PBI aktivite geçmişi ve değişiklik karşılaştırması", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-011-aktivite-gecmisi.md", "ac_done": 5, "ac_total": 5, "body": "## Amaç\n\nKullanıcı bir işin hayatını baştan sona görebilsin: kim açtı, ne zaman kime atandı, nereye taşındı, kapsamı nasıl büyüdü veya küçüldü, neden iptal edildi, AI'ın kendi testleri ne sonuç verdi.\n\n## Kapsam\n\n**Dahil:** PBI detay sheet'inde zaman çizelgesi (yeniden eskiye); kayıt türüne göre tek satırlık özet (\"claude · po durumu In Progress yaptı · 22:31\"); `check` kayıtları geçti/kaldı rozetiyle; `edited` kayıtlarında \"değişikliği göster\" ile başlık/body/kriterlerin eski ve yeni halinin satır satır karşılaştırması; `reason` varsa satırın altında; geri gönderme kayıtlarında not ve ekran görüntüsü küçük resimleri; \"sadece kararlar / sadece testler\" filtresi.\n**Hariç:** Bir eski hali geri yükleme (sonra).\n\n## Bağlam\n\n- Ürün kuralları: `docs/product.md` (hiçbir şey silinmez; agent'a varsayılan olarak özet gider).\n- Veri: `activity` tablosu `kind`, `before_json`, `after_json`, `message` (bkz. `docs/architecture.md` → Veri modeli). API: `GET /items/:key/activity`.\n- Metin farkı için hafif bir kütüphane (`diff`) yeterli; markdown'ı render etmeden satır bazında göster.\n- Tasarım: `docs/DESIGN.md` + Claude Design \"PBI detayı\" ekranı.\n\n## Kabul kriterleri\n\n- [x] Bir PBI üzerinde yapılan tüm değişiklikler zaman sırasıyla, kim ve ne zaman bilgisiyle listelenir.\n- [x] Body'si değiştirilmiş bir PBI'da \"değişikliği göster\" eski ve yeni hali eklenen/silinen satırlar renklendirilmiş halde gösterir.\n- [x] PBI iptali gerekçe isteyen bir onay penceresiyle yapılır (gerekçe zorunlu); iptal edilen PBI'nın geçmişinde neden ve önceki durumu görünür, iptal geri alınabilir.\n- [x] `check` kayıtları geçti/kaldı olarak ayırt edilir (renk + ikon, sadece renk değil).\n- [x] 200 kayıtlı bir PBI'da geçmiş akıcı açılır (sayfalama veya sanal liste).\n\n## Test planı\n\n1. Seed'deki bir PBI'nın başlığını ve body'sini iki kez değiştir, iptal et → geçmişte üç düzenleme ve iptal nedeni görünmeli.\n2. \"Değişikliği göster\" ile farkın doğru olduğunu kontrol et.\n\n## Notlar / log\n\n- 2026-11-06 claude:po codex'e (gpt-6.1-sol) paralel verdi.\n\n- 2026-11-06 codex bitirdi. check (claude:po): lint · typecheck temiz · test 59/59 · build geçti · e2e 18/18 · token e2e 1/1; ekran kontrol edildi.\n\n## Done notu\nGeçmiş sekmesi: zaman çizelgesi, filtreler, satır bazlı fark, iptal gerekçesi ve geri alma, 50'şerli yükleme.\n"}, {"id": "PBI-012", "title": "İnsan testi akışı, \"Seni bekliyor\", test senaryoları, onayla / geri gönder", "status": "done", "assignee": "codex", "priority": "P1", "updated": "2026-11-06", "file": "PBI-012-insan-testi-akisi.md", "ac_done": 15, "ac_total": 15, "body": "## Amaç\n\nAI'ın tek başına doğrulayamadığı işler kullanıcıya açık senaryolarla gelsin; kullanıcı tek yerden \"benden ne bekleniyor\"u görsün, test edip onaylasın ya da notla geri göndersin.\n\n## Kapsam\n\n**Dahil:**\n\n- Sidebar'da ve proje sayfasında **\"Seni bekliyor\"** listesi: Test'te olup kullanıcıya atanmış kartlar, sayı rozetiyle.\n- PBI detay sheet'inde **Test senaryoları** bölümü: AI'ın yazdığı adımlar + beklenen sonuç; kullanıcı senaryo ekler, düzenler, siler (silinen senaryo geçmişte kalır); her senaryoya geçti/kaldı işareti.\n- **Onayla** → Done (kayıt: \"mert onayladı\"). **Geri gönder** → In Progress, zorunlu not + isteğe bağlı ekran görüntüsü (yapıştır veya sürükle-bırak, PNG/JPG, ≤ 10 MB), atanan son AI agent'a döner.\n- Proje ayarları ekranı: Test kolonu açık/kapalı, AI Done'a çekebilir mi, Definition of Done metni.\n- Done kartlarında **\"görülmedi\"** işareti; kullanıcı kartı açınca kalkar. Proje özetinde \"görülmemiş 3 tamamlanan iş\".\n  **Hariç:** Geri gönderilince AI'ı anında tetikleme (açık konu, `docs/product.md`).\n\n## Bağlam\n\n- Akış ve kurallar: `docs/product.md` → Akış, Proje ayarları.\n- Veri: `test_scenarios`, `attachments`, `items.seen_at` (PBI-002). Ekler `POST /items/:key/attachments` (multipart) ile yüklenir, `PANO_DATA_DIR/attachments/` altında saklanır.\n- Agent tarafı: `update_item` ile `status: test`, `assignee: mert` ve senaryolar tek çağrıda verilebilmeli; geri gönderme notu `get_item` cevabında en üstte görünmeli ki orkestratör bir sonraki kontrolünde hemen görsün.\n- Tasarım: `docs/DESIGN.md` + Claude Design \"PBI detayı\" ekranı (Test durumundaki varyantı PBI-004'te eklenecek).\n\n## Kabul kriterleri\n- [x] Test detayında AI'ın yazdığı \"Ne değişti\" ve \"Nasıl denerim\" görünür.\n- [x] \"Geri ata\" zorunlu notla kartı Test'te bırakır, AI'a atar ve \"Seni bekliyor\"dan çıkarır; not `get_item` cevabının başında görünür.\n\n- [x] AI bir kartı senaryolarla kullanıcıya atadığında kart \"Seni bekliyor\" listesinde ve Test kolonunda görünür.\n- [x] Kullanıcı senaryo ekleyip düzenleyebilir; değişiklikler geçmişte görünür.\n- [x] \"Onayla\" kartı Done'a taşır; \"Geri gönder\" not olmadan gönderilemez, ekran görüntüsüyle birlikte kaydedilir ve kart In Progress'e, son AI agent'a döner.\n- [x] Geri gönderilen kartı `get_item` ile okuyan agent kullanıcının notunu ve ekin linkini ilk sırada alır.\n- [x] Test kolonu kapalı projede \"Seni bekliyor\" listesi ve Test kolonu görünmez.\n- [x] Görülmemiş Done kartları işaretli; açılınca işaret kalkar.\n- [x] Herhangi bir senaryo \"Kaldı kriter kind'ı değişmeden önceki kayıtlar.\n\n## Done notu\nTest kartı: Ne değişti, Nasıl denerim, senaryolar, AI testleri; Onayla, Geri gönder (not + ekran görüntüsü), Geri ata. Proje ayarları ve projeler arası Seni bekliyor çalışıyor. Bilinen kısıt: AI'ın anında tetiklenmesi açık konu.\n"}, {"id": "PBI-013", "title": "Proje özeti, proje ne aşamada, bir bakışta", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-013-proje-ozeti.md", "ac_done": 4, "ac_total": 4, "body": "## Amaç\nKullanıcı Pano'yu açtığında \"ne zaman başladım, kaç iş bitti, kaç iş kaldı, şu an ne yapılıyor, benden ne bekleniyor\" sorularına tek ekranda cevap alsın.\n\n## Kapsam\n**Dahil:** Board toolbar'ının altında **tek ince satır**: ilerleme çubuğu (tamamlanan/toplam) + kısa metin (ör. \"13 kaldı · 5 Kas'ta başladı · 6 yüksek öncelikli\"). Ayrıntı (iptal sayısı, son 7 gün, burn-up) satıra tıklayınca açılan küçük bir popover'da. \"Seni bekliyor\" sidebar'da, görülmemiş Done sayısı burada tekrar edilmez (2026-11-05 kararı).\n**Hariç:** Tahmini bitiş tarihi, sprint/velocity.\n\n## Bağlam\n- Ürün soruları: `docs/product.md` → \"Kullanıcının cevap alması gereken sorular\".\n- Veri `projects.created_at`, `items` ve `activity`'den hesaplanır; yeni tablo gerekmez. API: `GET /projects/:key/summary`.\n- Çizgi grafik hafif olsun (SVG ile kendimiz çizebiliriz; kütüphane gerekirse küçük bir tane).\n- Tasarım: `docs/DESIGN.md`; bu ekran PBI-004'te Claude Design'a eklenecek.\n\n## Kabul kriterleri\n- [x] Özet, seed projesinde doğru sayıları gösterir (testle doğrulanır).\n- [x] Bir kart Done'a taşınınca özet sayfa yenilemeden güncellenir.\n- [x] Burn-up çizgisi son 30 günü gösterir; boş projede açıklayıcı boş durum çıkar.\n- [x] Sayılar ekran okuyucuyla anlamlı okunur (görünmez etiketler).\n\n## Test planı\n1. Seed projesini aç → özet sayılarını board ile karşılaştır.\n2. Bir kartı Done'a çek → özet anında değişmeli.\n\n## Notlar / log\n\n- 2026-11-06 claude:po codex'e (gpt-6.1-sol) paralel verdi.\n\n- 2026-11-06 codex bitirdi. check (claude:po): lint · typecheck temiz · test 49/49 · e2e 14/14; özet satırı ve API ekranda görüldü.\n\n## Done notu\nBoard'da tek satır özet, tıklayınca iptal sayısı, öncelik dağılımı, son 7 gün ve burn-up. Kısıt: popover görsel olarak Mert tarafından denenmedi.\n"}, {"id": "PBI-014", "title": "Uygulama ayarları, dil, görünüm, sürüm ve güncelleme", "status": "done", "assignee": "codex", "priority": "P2", "updated": "2026-11-06", "file": "PBI-014-uygulama-ayarlari.md", "ac_done": 6, "ac_total": 6, "body": "## Amaç\nPano'yu kuran herkes arayüzü kendi dilinde ve tercih ettiği görünümde kullanabilsin, hangi sürümde olduğunu ve yeni sürüm çıkıp çıkmadığını görebilsin.\n\n## Kapsam\n**Dahil:**\n- **Uygulama ayarları ekranı** (proje ayarlarından ayrı; sidebar'ın altındaki \"Ayarlar\"dan açılır): Genel, Görünüm, Agent bağlantısı, Hakkında bölümleri.\n- **Dil:** Türkçe ve English. Varsayılan tarayıcı/sistem dili; desteklenmiyorsa English. Tüm arayüz metinleri çeviri dosyalarından gelir; bilinen teknik terimler (Backlog, In Progress, Test, Done, PBI) her dilde İngilizce kalır (`apps/web/src/i18n/tr.json`, `en.json`); tarih/saat biçimi dile göre (`Intl.DateTimeFormat`). Agent'ların yazdığı PBI içerikleri çevrilmez.\n- **Görünüm:** Açık / Koyu / Otomatik (sistemi takip eder, varsayılan). Seçim anında uygulanır, sayfa yenilemede kalır.\n- **Hakkında:** sürüm numarası, build tarihi, veri klasörü yolu, veritabanı boyutu, lisans (MIT), GitHub linki.\n- **Güncelleme kontrolü:** sunucu açılışta ve günde bir kez GitHub Releases'ten son sürümü kontrol eder (ayarla kapatılabilir; çevrimdışıysa sessizce geçer). Yeni sürüm varsa ayarlarda ve sidebar'ın altında sakin bir \"Yeni sürüm: v0.2.0\" bildirimi; tıklayınca sürüm notları linki ve kurulum türüne göre güncelleme komutu (binary: `pano update`; Docker: `docker pull ghcr.io/metonya/pano:latest` + yeniden başlat).\n- **`pano update`** (CLI): yeni sürümün binary'sini indirir, SHA-256 checksum'ını release'teki dosyayla doğrular, mevcut binary'yi yedekleyip değiştirir; Docker içinde çalışıyorsa komut yerine Docker talimatı verir.\n- `GET /api/v1/system` → `{ version, buildDate, dataDir, dbSize, latestVersion?, updateAvailable }`.\n**Hariç:** Otomatik (kullanıcı onayı olmadan) güncelleme, ikiden fazla dil, kullanıcı başına ayar (tek kullanıcı).\n\n## Bağlam\n- Ayarlar sunucu tarafında `settings` tablosunda (anahtar/değer) saklanır; görünüm ve dil ayrıca `localStorage`'a yazılır ki ilk boyamada yanlış tema yanıp sönmesin.\n- Sürüm `package.json`'dan build sırasında binary'ye gömülür (PBI-010 ile birlikte).\n- Tasarım: `docs/DESIGN.md` + Claude Design'a \"Uygulama ayarları\" ekranı eklenecek (PBI-004).\n- Ürün kuralları: `docs/product.md`.\n\n## Kabul kriterleri\n- [x] Sürükle-bırak ekran okuyucu duyuruları seçili dilde ve PBI numarasıyla okunur (teknik ID değil; PBI-006'dan devralındı).\n- [x] Dil English yapılınca tüm arayüz (statüler, butonlar, boş durumlar, tarih biçimi) İngilizce görünür; eksik çeviri anahtarı CI'da test ile yakalanır.\n- [x] Görünüm Açık/Koyu/Otomatik arasında anında değişir; Otomatik'te sistem teması değişince arayüz de değişir; yenilemede tema yanıp sönmez.\n- [x] Hakkında bölümü doğru sürüm ve veri klasörünü gösterir.\n- [x] Sahte bir release cevabıyla (test) yeni sürüm bildirimi görünür; güncelleme kontrolü kapatılınca hiç istek atılmaz.\n- [x] `pano update` checksum uyuşmazsa binary'yi değiştirmez ve açıklayıcı hata verir; başarılı güncellemeden sonra `pano --version` yeni sürümü gösterir.\n\n## Test planı\n1. Ayarlardan dili English yap → board'u ve bir PBI'yı gez.\n2. Görünümü Koyu, sonra Otomatik yap; sistem temasını değiştir.\n3. Hakkında'da sürüm bilgisini kontrol et.\n\n## Notlar / log\n\n- 2026-11-06 claude:po codex'e (gpt-6.1-terra) paralel verdi.\n\n- 2026-11-06 codex bitirdi. check (claude:po): lint · typecheck temiz · test 59/59 · build geçti · e2e 18/18 · token e2e 1/1; ekran kontrol edildi. Açık: repo private ve release yok, gerçek binary ile `pano update` uçtan uca denenemedi.\n\n- 2026-11-06 codex `pano update` testlerini yazdı, Windows `.old` akışı ve hata durumunda geri yüklemeyi ekledi. check (claude:po): test 76/76.\n\n## Done notu\nAyarlar ekranı, Türkçe/English, Açık/Koyu/Otomatik, sürüm ve güncelleme bildirimi, `pano update`. Bilinen kısıt: `pano update` sahte sunucuyla test edildi; gerçek release ile denenmedi (repo private, release yok).\n"}]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src){const L=src.split(/\r?\n/);let h='',inList=false,inCode=false;
 const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
 for(const l of L){if(l.startsWith('```')){if(inList){h+='</ul>';inList=false}h+=inCode?'</pre>':'<pre>';inCode=!inCode;continue}
  if(inCode){h+=esc(l)+'\n';continue}
  const li=l.match(/^\s*[-*] (\[( |x|X)\] )?(.*)$/);
  if(li){if(!inList){h+='<ul>';inList=true}h+='<li>'+(li[1]?`<input type="checkbox" disabled ${li[2]!==' '?'checked':''}>`:'')+inline(li[3])+'</li>';continue}
  if(inList){h+='</ul>';inList=false}
  const hd=l.match(/^(#{1,4}) (.*)$/);if(hd){h+=`<h${hd[1].length+1}>${inline(hd[2])}</h${hd[1].length+1}>`;continue}
  if(l.trim())h+='<p>'+inline(l)+'</p>'}
 return h+(inList?'</ul>':'')+(inCode?'</pre>':'')}
function render(){const q=document.getElementById('q').value.toLowerCase();const b=document.getElementById('board');b.innerHTML='';
 const items=D.items.filter(i=>!q||(i.id+' '+i.title+' '+i.assignee).toLowerCase().includes(q));
 for(const [k,name] of D.statuses){const col=items.filter(i=>i.status===k).sort((a,c)=>a.priority.localeCompare(c.priority)||a.id.localeCompare(c.id));
  const el=document.createElement('section');el.className='col';
  el.innerHTML=`<h2><span>${name}</span><span>${col.length}</span></h2><div class="cards">${col.map(i=>`
  <article class="card" data-f="${esc(i.file)}"><div class="row"><span class="id">${esc(i.id)}</span><span class="pill ${esc(i.priority)}">${esc(i.priority)}</span>${i.assignee&&i.assignee!=='-'?`<span class="pill who">${esc(i.assignee)}</span>`:''}</div>
  <div class="t">${esc(i.title)}</div>${i.ac_total?`<div class="row"><div class="bar"><i style="width:${100*i.ac_done/i.ac_total}%"></i></div><span>${i.ac_done}/${i.ac_total}</span></div>`:''}</article>`).join('')||'<div class="empty">Boş</div>'}</div>`;
  b.appendChild(el)}
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const i=D.items.find(x=>x.file===c.dataset.f);
  document.getElementById('dt').textContent=i.id+' · '+i.title;document.getElementById('db').innerHTML=md(i.body);dlg.showModal()});
 const n=s=>D.items.filter(i=>i.status===s).length;
 document.getElementById('sum').textContent=`${D.items.length} PBI · ${n('in-progress')} devam ediyor · ${n('test')} test'te · ${n('done')} tamamlandı`}
document.getElementById('q').oninput=render;render();
</script></body></html>
